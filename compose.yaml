services:
  app:
    build: .
    environment:
      VERITY_PRODUCTION: "1"
    volumes:
      - type: bind
        source: ./backend/models/gend-clip-l14.safetensors
        target: /app/backend/models/gend-clip-l14.safetensors
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/models/thresholds.json
        target: /app/backend/models/thresholds.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/models/ai-image/runC/checkpoints/best.pt
        target: /app/backend/models/ai-image/runC/checkpoints/best.pt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    mem_limit: 6g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10))['ready']"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 3

  proxy:
    image: caddy:2.10
    environment:
      VERITY_DOMAIN: ${VERITY_DOMAIN:?Set VERITY_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
